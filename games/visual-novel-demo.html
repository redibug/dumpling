<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Visual-Novel Theme Demo</title>
    <meta name="viewport" content="user-scalable=no, width=device-width">
    <!-- Dumpling injects the theme stylesheets itself (see dumpling.theme). -->
  </head>
  <body>
    <div id="toolbar"><h1>VN Demo</h1><div class="nav"><a href="#" class="button" id="menu-button">Menu</a></div></div>
    <ul id="menu">
      <li><a href="#title, #content_wrapper">Story</a></li>
    </ul>

    <div id="page">
      <div id="tools_wrapper">
        <div id="info_panel" class="tools left">
          <h1>VN Demo</h1>
          <p>A three-beat toy for the visual-novel theme.</p>
          <div class="buttons">
            <button id="back">Back</button><button id="erase">Erase</button>
          </div>
        </div>
        <!-- Log toggle: a theme cannot add elements, so the shell
             carries this checkbox and the theme styles it. Never
             build it from anchor links — the URL hash is the save. -->
        <div id="vn-logbar">
          <input type="checkbox" id="vn-log-toggle">
          <label for="vn-log-toggle">Log</label>
        </div>
        <div id="character_panel" class="tools right">
          <h1>Character</h1>
          <div id="character">
            <div id="character_text"><div id="character_text_content"></div></div>
            <div id="qualities"></div>
          </div>
        </div>
      </div>

      <div id="mid_panel">
        <div id="title">
          <div class="label">
            <h1>The Academy at Dusk</h1>
            <h2>a visual-novel theme demo</h2>
            <noscript><p class="noscript_message">This game requires Javascript.</p></noscript>
            <p class="click_message">click to begin</p>
          </div>
        </div>

        <div id="content_wrapper">
          <div id="content"></div>
          <a name="end_of_content"></a>
        </div>

        <div id="legal">
          <p>Demo only — scene art is CSS gradients, not images.</p>
        </div>
      </div>
    </div>

    <div id="ui_library">
      <div id="quality" class="quality">
        <span class="name" data-attr="name"></span>
        <span class="value" data-attr="value"></span>
      </div>
      <div id="quality_group" class="quality_group">
        <h2 data-attr="title"></h2>
        <div class="qualities_in_group"></div>
      </div>
      <div id="progress_bar" class="progress_bar">
        <span class="name" data-attr="name"></span>
        <span class="value" data-attr="value"></span>
        <div class="progress_bar_track"><div class="progress_bar_color" data-attr="width"></div></div>
        <span class="left_label" data-attr="left_label"></span>
        <span class="right_label" data-attr="right_label"></span>
      </div>
      <hr id="turn_separator">
    </div>
    <div id="content_library"></div>

    <script type="text/javascript" src="media/js/dumpling.js"></script>
    <script type="text/javascript" src="media/games/visual-novel-demo/game.js"></script>
  </body>
</html>
